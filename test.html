<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test.com - Python Code Editor</title>
  <!-- Load Pyodide for Browser-Based Python Execution -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }

    /* Navigation Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: #161b22;
      border-bottom: 1px solid #30363d;
    }
    .logo { color: #00ff66; font-weight: bold; font-family: monospace; font-size: 1.2rem; }
    nav a { color: #c9d1d9; text-decoration: none; margin-left: 1.5rem; font-size: 0.9rem; }
    nav a.active { color: #00ff66; border-bottom: 2px solid #00ff66; padding-bottom: 2px; }

    /* Split-Pane Editor Layout */
    .editor-container {
      display: flex;
      height: calc(100vh - 120px);
      padding: 1rem;
      gap: 1rem;
    }
    .pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      overflow: hidden;
    }
    .pane-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #21262d;
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      letter-spacing: 1px;
      color: #8b949e;
      font-family: monospace;
    }

    /* Run Button */
    .run-btn {
      background-color: #238636;
      color: #ffffff;
      border: none;
      padding: 0.3rem 0.8rem;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: sans-serif;
    }
    .run-btn:hover { background-color: #2ea043; }
    .run-btn:disabled { background-color: #30363d; color: #8b949e; cursor: wait; }

    /* Textarea & Terminal Output */
    textarea {
      flex: 1;
      background: #0d1117;
      color: #00ff66;
      border: none;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      line-height: 1.5;
    }

    .output-box {
      flex: 1;
      background: #000000;
      color: #00ff66;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.9rem;
      white-space: pre-wrap;
      overflow-y: auto;
    }
    .output-box .error { color: #ff7b72; }
    .output-box .info { color: #8b949e; }

    footer {
      text-align: center;
      padding: 1rem;
      color: #8b949e;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Test.com</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">File Format Changer</a>
      <a href="#">Integrated Code Editor</a>
      <a href="#" class="active">Python Editor</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main class="editor-container">
    <!-- Left Pane: Python Code Input -->
    <div class="pane">
      <div class="pane-title">
        <span>PYTHON SOURCE CODE</span>
        <button class="run-btn" id="run-btn" disabled>Loading Engine...</button>
      </div>
      <textarea id="python-code" spellcheck="false"># Write your Python code here
def greet(name):
    return f"Hello, {name}! Welcome to Test.com Python Editor."

print(greet("Developer"))

# Calculate Fibonacci sequence
n_terms = 10
a, b = 0, 1
print("\nFibonacci Sequence:")
for _ in range(n_terms):
    print(a, end=" ")
    a, b = b, a + b
print()
</textarea>
    </div>

    <!-- Right Pane: Terminal Output -->
    <div class="pane">
      <div class="pane-title">CONSOLE OUTPUT</div>
      <div class="output-box" id="output-box">
        <span class="info">Initializing Python WebAssembly environment...</span>
      </div>
    </div>
  </main>

  <footer>&copy; 2026 Test.com. All rights reserved.</footer>

  <!-- Python Execution Script -->
  <script>
    const outputBox = document.getElementById('output-box');
    const runBtn = document.getElementById('run-btn');
    const pythonCode = document.getElementById('python-code');
    let pyodideInstance = null;

    // Initialize Pyodide engine
    async function initPyodide() {
      try {
        pyodideInstance = await loadPyodide();
        outputBox.innerHTML = '<span class="info">Python 3 engine ready. Click "Run Code" to execute.</span>';
        runBtn.textContent = "▶ Run Code";
        runBtn.disabled = false;
      } catch (err) {
        outputBox.innerHTML = `<span class="error">Failed to load Python engine: ${err.message}</span>`;
      }
    }

    initPyodide();

    // Run Python Code
    runBtn.addEventListener('click', async () => {
      if (!pyodideInstance) return;

      outputBox.innerHTML = '';
      
      // Redirect stdout and stderr to JavaScript
      pyodideInstance.setStdout({
        batched: (str) => { outputBox.innerText += str + '\n'; }
      });
      pyodideInstance.setStderr({
        batched: (str) => {
          const errSpan = document.createElement('span');
          errSpan.className = 'error';
          errSpan.innerText = str + '\n';
          outputBox.appendChild(errSpan);
        }
      });

      try {
        await pyodideInstance.runPythonAsync(pythonCode.value);
      } catch (err) {
        const errSpan = document.createElement('span');
        errSpan.className = 'error';
        errSpan.innerText = err.message;
        outputBox.appendChild(errSpan);
      }
    });
  </script>
</body>
</html>
